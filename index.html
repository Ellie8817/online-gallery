<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>青年百億線上展覽館</title>

  <!-- 3D 引擎與多人連線套件 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.slim.js"></script>
  <script src="https://unpkg.com/networked-aframe@^0.8.4/dist/networked-aframe.min.js"></script>

  <style>
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; margin: 0; }

    /* 頂部控制面板 */
    #ui-container {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.95);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      width: 290px;
    }
    #exhibition-title {
      font-size: 18px;
      font-weight: bold;
      color: #0f172a;
      margin-bottom: 8px;
      border-bottom: 2px solid #3b82f6;
      padding-bottom: 4px;
    }
    .btn {
      background: #2563eb;
      color: white;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin-bottom: 8px;
    }
    .btn-guide { background: #059669; }
    .btn:hover { opacity: 0.9; }
    #file-input { display: none; }
    
    /* 聊天室 */
    #chat-box {
      margin-top: 10px;
      border-top: 1px solid #e2e8f0;
      padding-top: 8px;
    }
    #chat-messages {
      height: 80px;
      overflow-y: auto;
      background: #f8fafc;
      font-size: 12px;
      padding: 6px;
      margin-bottom: 6px;
      border-radius: 4px;
      border: 1px solid #cbd5e1;
    }
    .chat-input-group { display: flex; gap: 4px; }
    #chat-input { flex: 1; padding: 4px; border: 1px solid #cbd5e1; border-radius: 4px; }

    /* 展品詳情彈窗 Modal */
    #art-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 320px;
      max-width: 80%;
    }
    #art-modal h4 { margin: 0 0 6px 0; color: #1e293b; font-size: 18px; }
    #art-modal .author { font-size: 13px; color: #64748b; margin-bottom: 12px; }
    #art-modal .desc { font-size: 14px; color: #334155; line-height: 1.5; white-space: pre-line; }
    #art-modal .close-btn {
      margin-top: 15px;
      background: #64748b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      float: right;
    }
  </style>
</head>
<body>

  <!-- 頂部控制面板 -->
  <div id="ui-container">
    <div id="exhibition-title">🖼️ 我們的光影線上展覽</div>
    <button class="btn" onclick="document.getElementById('file-input').click()">➕ 上傳作品與說明</button>
    <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)">
    
    <button class="btn btn-guide" id="guide-btn" onclick="toggleGuideMode()">🚩 開啟 / 取消跟隨導覽</button>

    <!-- 即時聊天視窗 -->
    <div id="chat-box">
      <div id="chat-messages"><div><strong>[系統]:</strong> 點擊展場牆上的照片可查看詳細介紹！</div></div>
      <div class="chat-input-group">
        <input type="text" id="chat-input" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter') sendChat()">
        <button onclick="sendChat()" style="padding: 4px 8px; cursor:pointer;">傳送</button>
      </div>
    </div>
  </div>

  <!-- 展品詳細資訊視窗 -->
  <div id="art-modal">
    <h4 id="modal-title">作品標題</h4>
    <div class="author" id="modal-author">創作者：匿名</div>
    <div class="desc" id="modal-desc">作品介紹...</div>
    <button class="close-btn" onclick="closeModal()">關閉</button>
  </div>

  <!-- 3D 連線場景 -->
  <a-scene networked-scene="
    room: my-custom-gallery-room;
    debug: true;
    adapter: wseasyrtc;
  ">
    <a-assets>
      <template id="avatar-template">
        <a-entity class="avatar">
          <a-sphere class="head" color="#3b82f6" radius="0.25" position="0 0.25 0"></a-sphere>
          <a-sphere color="#ffffff" radius="0.05" position="0.1 0.3 -0.2"></a-sphere>
          <a-sphere color="#ffffff" radius="0.05" position="-0.1 0.3 -0.2"></a-sphere>
        </a-entity>
      </template>
    </a-assets>

    <!-- 空間環境與牆面 -->
    <a-sky color="#f1f5f9"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#cbd5e1"></a-plane>
    <a-plane position="0 3 -8" width="16" height="6" color="#ffffff"></a-plane>
    <a-plane position="-8 3 0" rotation="0 90 0" width="16" height="6" color="#f8fafc"></a-plane>
    <a-plane position="8 3 0" rotation="0 -90 0" width="16" height="6" color="#f8fafc"></a-plane>

    <!-- 動態展品掛載區 -->
    <a-entity id="gallery-wall"></a-entity>

    <!-- 玩家玩家視角 (含滑鼠點擊 Raycaster 游標) -->
    <a-entity id="rig" movement-controls position="0 1.6 0">
      <a-entity id="player"
        networked="template:#avatar-template;attachTemplateToLocal:false;"
        camera look-controls wasd-controls>
        <!-- 畫面中央點擊游標 -->
        <a-cursor color="#2563eb" radius-inner="0.005" radius-outer="0.01"></a-cursor>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    let imageCount = 0;
    let isFollowing = false;

    // 1. 處理照片上傳與輸入介紹資料
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      // 跳出提示框讓使用者輸入作品資訊
      const title = prompt("請輸入作品名稱：", "無題") || "無題";
      const author = prompt("請輸入創作者姓名：", "匿名") || "匿名";
      const desc = prompt("請輸入作品介紹/創作理念：", "暫無介紹。") || "暫無介紹。";

      const reader = new FileReader();
      reader.onload = function(e) {
        const imageUrl = e.target.result;
        const artData = { url: imageUrl, title, author, desc };
        
        renderImageOnWall(artData);

        // NAF 連線廣播給所有人
        if (NAF.connection.isConnected()) {
          NAF.connection.broadcastData('new-image', artData);
        }
      };
      reader.readAsDataURL(file);
    }

    // 2. 將作品與說明卡掛載到 3D 牆上
    function renderImageOnWall(data) {
      imageCount++;
      const galleryWall = document.getElementById('gallery-wall');
      
      // 建立畫框容器
      const artEntity = document.createElement('a-entity');

      // 計算牆面掛載位置
      const xPos = (imageCount % 2 === 1) ? -3.5 : 3.5;
      const zPos = -7.8;
      artEntity.setAttribute('position', `${xPos} 3 ${zPos}`);

      // 2D 照片本體
      const img = document.createElement('a-image');
      img.setAttribute('src', data.url);
      img.setAttribute('width', '2.5');
      img.setAttribute('height', '1.8');

      // 照片下方的 3D 展牌說明 (呈現作品名與創作者)
      const label = document.createElement('a-text');
      label.setAttribute('value', `${data.title}\nBy ${data.author}`);
      label.setAttribute('align', 'center');
      label.setAttribute('color', '#334155');
      label.setAttribute('width', '3');
      label.setAttribute('position', '0 -1.1 0.05');

      artEntity.appendChild(img);
      artEntity.appendChild(label);

      // 點擊作品跳出詳細介紹卡片
      artEntity.addEventListener('click', function () {
        showModal(data.title, data.author, data.desc);
      });

      galleryWall.appendChild(artEntity);
    }

    // 3. 彈窗 Modal 控制
    function showModal(title, author, desc) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-author').textContent = `創作者：${author}`;
      document.getElementById('modal-desc').textContent = desc;
      document.getElementById('art-modal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('art-modal').style.display = 'none';
    }

    // 4. 連線廣播監聽
    document.body.addEventListener('connected', function () {
      NAF.connection.subscribeToData('new-image', (senderId, dataType, data) => {
        renderImageOnWall(data);
      });

      NAF.connection.subscribeToData('chat-msg', (senderId, dataType, data) => {
        appendChatMessage(data.sender, data.text);
      });
    });

    // 5. 文字聊天
    function sendChat() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      appendChatMessage('我', text);
      if (NAF.connection.isConnected()) {
        NAF.connection.broadcastData('chat-msg', { sender: '訪客', text: text });
      }
      input.value = '';
    }

    function appendChatMessage(sender, text) {
      const msgBox = document.getElementById('chat-messages');
      const newMsg = document.createElement('div');
      newMsg.innerHTML = `<strong>${sender}:</strong> ${text}`;
      msgBox.appendChild(newMsg);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    // 6. 導覽模式
    function toggleGuideMode() {
      isFollowing = !isFollowing;
      const btn = document.getElementById('guide-btn');
      if (isFollowing) {
        btn.textContent = '❌ 取消跟隨';
        document.getElementById('rig').setAttribute('position', '0 1.6 -4');
      } else {
        btn.textContent = '🚩 開啟 / 取消跟隨導覽';
        document.getElementById('rig').setAttribute('position', '0 1.6 0');
      }
    }
  </script>

</body>
</html>
