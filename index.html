<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>極簡高畫質藝廊</title>

  <!-- A-Frame 3D 引擎與連線套件 -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.slim.js"></script>
  <script src="https://unpkg.com/networked-aframe@^0.8.4/dist/networked-aframe.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; overflow: hidden; }

    /* 頂部極簡導覽列 */
    #navbar {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      color: white;
    }
    #exhibition-title { font-size: 16px; font-weight: 600; letter-spacing: 1px; }
    .btn-action {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-action:hover { background: #2563eb; transform: scale(1.05); }
    #file-input { display: none; }

    /* 作品點擊詳細互動視窗 */
    #art-modal {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(16px);
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
      width: 360px;
      max-width: 90vw;
    }
    #art-modal h3 { margin: 0 0 4px 0; color: #0f172a; font-size: 20px; }
    #art-modal .author { font-size: 13px; color: #64748b; font-weight: 500; margin-bottom: 12px; }
    #art-modal .desc { font-size: 14px; color: #334155; line-height: 1.6; margin-bottom: 16px; }

    .like-section { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .like-btn {
      background: #fff0f6;
      color: #e11d48;
      border: 1px solid #fecdd3;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .like-btn:hover { background: #ffe4e6; }

    .comments-section { border-top: 1px solid #e2e8f0; padding-top: 12px; }
    .comments-title { font-weight: 600; font-size: 13px; color: #475569; margin-bottom: 8px; }
    .comments-list { max-height: 100px; overflow-y: auto; font-size: 13px; color: #334155; margin-bottom: 8px; }
    .comment-item { background: #f8fafc; padding: 6px 10px; border-radius: 8px; margin-bottom: 4px; }
    .comment-input-group { display: flex; gap: 6px; }
    .comment-input-group input { flex: 1; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
    
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <div id="navbar">
    <div id="exhibition-title">✨ 我的光影藝廊</div>
    <button class="btn-action" onclick="document.getElementById('file-input').click()">➕ 參展 / 上傳畫作</button>
    <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)">
  </div>

  <!-- 作品彈窗 -->
  <div id="art-modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="modal-title">作品標題</h3>
    <div class="author" id="modal-author">By 創作者</div>
    <div class="desc" id="modal-desc">作品介紹...</div>

    <div class="like-section">
      <button class="like-btn" onclick="addLike()">❤️ <span id="modal-like-count">0</span> 人喜愛</button>
    </div>

    <div class="comments-section">
      <div class="comments-title">💬 觀展留言</div>
      <div class="comments-list" id="modal-comments-list"></div>
      <div class="comment-input-group">
        <input type="text" id="comment-input" placeholder="寫下你的心得..." onkeydown="if(event.key==='Enter') submitComment()">
        <button class="btn-action" style="padding: 6px 12px;" onclick="submitComment()">送出</button>
      </div>
    </div>
  </div>

  <!-- 3D 展覽場景 -->
  <a-scene networked-scene="room: custom-hd-gallery; debug: true; adapter: wseasyrtc;">
    <a-assets>
      <template id="avatar-template">
        <a-entity class="avatar">
          <a-sphere class="head" color="#60a5fa" radius="0.2" position="0 0.2 0"></a-sphere>
        </a-entity>
      </template>
    </a-assets>

    <!-- 高質感藝廊空間背景與地磚 -->
    <a-sky color="#0b0f19"></a-sky>
    <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#1e293b" material="roughness: 0.2; metalness: 0.1"></a-plane>
    <a-plane position="0 4 -8" width="20" height="8" color="#f8fafc"></a-plane>

    <!-- 動態畫作容器 -->
    <a-entity id="gallery-wall"></a-entity>

    <!-- 視角與隱藏圓點 cursor -->
    <a-entity id="rig" movement-controls position="0 1.6 0">
      <a-entity id="player" camera look-controls wasd-controls>
        <!-- 啟用滑鼠直接點擊，無中央圓點 -->
        <a-entity raycaster="objects: .clickable" cursor="rayOrigin: mouse"></a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    let imageCount = 0;
    let currentArtData = null;
    const galleryStore = {};

    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const title = prompt("請輸入作品名稱：", "日光漫步") || "無題";
      const author = prompt("請輸入創作者姓名：", "玟嬡") || "匿名";
      const desc = prompt("請輸入作品介紹：", "這是一幅捕捉光影變化的作品。") || "暫無介紹。";

      const reader = new FileReader();
      reader.onload = function(e) {
        const id = 'art_' + Date.now();
        const artData = { id, url: e.target.result, title, author, desc, likes: 0, comments: [] };
        
        galleryStore[id] = artData;
        renderHighQualityArt(artData);

        if (NAF.connection.isConnected()) {
          NAF.connection.broadcastData('new-image', artData);
        }
      };
      reader.readAsDataURL(file);
    }

    function renderHighQualityArt(data) {
      imageCount++;
      const galleryWall = document.getElementById('gallery-wall');
      const artEntity = document.createElement('a-entity');
      artEntity.setAttribute('id', data.id);

      // 計算放置位置 (左右交錯)
      const xPos = (imageCount % 2 === 1) ? -4.5 : 4.5;
      const yPos = 4.0;
      const zPos = -7.8;
      artEntity.setAttribute('position', `${xPos} ${yPos} ${zPos}`);

      // 1. 立體木質畫框 (加厚外框)
      const frame = document.createElement('a-box');
      frame.setAttribute('color', '#1e1b18'); // 深木色畫框
      frame.setAttribute('width', '3.2');
      frame.setAttribute('height', '2.4');
      frame.setAttribute('depth', '0.1');
      frame.setAttribute('position', '0 0 -0.05');

      // 2. 畫框卡紙白邊 (Mat board)
      const mat = document.createElement('a-plane');
      mat.setAttribute('color', '#ffffff');
      mat.setAttribute('width', '3.0');
      mat.setAttribute('height', '2.2');
      mat.setAttribute('position', '0 0 0.01');

      // 3. 高畫質照片本體
      const img = document.createElement('a-image');
      img.setAttribute('src', data.url);
      img.setAttribute('width', '2.7');
      img.setAttribute('height', '1.9');
      img.setAttribute('position', '0 0 0.02');
      img.setAttribute('class', 'clickable'); // 可點擊
      // 設定高清晰度濾鏡
      img.setAttribute('material', 'npot: true; anisotropy: 16;');

      // 4. 掛畫繩索細節
      const cordLeft = document.createElement('a-cylinder');
      cordLeft.setAttribute('color', '#94a3b8');
      cordLeft.setAttribute('radius', '0.01');
      cordLeft.setAttribute('height', '1.5');
      cordLeft.setAttribute('position', '-1.2 1.8 -0.02');
      cordLeft.setAttribute('rotation', '0 0 -25');

      const cordRight = document.createElement('a-cylinder');
      cordRight.setAttribute('color', '#94a3b8');
      cordRight.setAttribute('radius', '0.01');
      cordRight.setAttribute('height', '1.5');
      cordRight.setAttribute('position', '1.2 1.8 -0.02');
      cordRight.setAttribute('rotation', '0 0 25');

      // 5. 高質感作品說明名牌
      const plate = document.createElement('a-plane');
      plate.setAttribute('color', '#0f172a');
      plate.setAttribute('width', '2.2');
      plate.setAttribute('height', '0.6');
      plate.setAttribute('position', '0 -1.6 0.02');

      const plateText = document.createElement('a-text');
      plateText.setAttribute('value', `${data.title}\nBy ${data.author}`);
      plateText.setAttribute('align', 'center');
      plateText.setAttribute('color', '#f8fafc');
      plateText.setAttribute('width', '3.5');
      plateText.setAttribute('position', '0 0 0.01');
      plate.appendChild(plateText);

      // 組合元件
      artEntity.appendChild(frame);
      artEntity.appendChild(mat);
      artEntity.appendChild(img);
      artEntity.appendChild(cordLeft);
      artEntity.appendChild(cordRight);
      artEntity.appendChild(plate);

      // 點擊事件
      img.addEventListener('click', function () {
        openModal(data.id);
      });

      galleryWall.appendChild(artEntity);
    }

    function openModal(artId) {
      currentArtData = galleryStore[artId];
      if (!currentArtData) return;

      document.getElementById('modal-title').textContent = currentArtData.title;
      document.getElementById('modal-author').textContent = `By ${currentArtData.author}`;
      document.getElementById('modal-desc').textContent = currentArtData.desc;
      document.getElementById('modal-like-count').textContent = currentArtData.likes || 0;

      updateCommentsUI();
      document.getElementById('art-modal').style.display = 'block';
    }

    function closeModal() {
      document.getElementById('art-modal').style.display = 'none';
    }

    function addLike() {
      if (!currentArtData) return;
      currentArtData.likes = (currentArtData.likes || 0) + 1;
      document.getElementById('modal-like-count').textContent = currentArtData.likes;

      if (NAF.connection.isConnected()) {
        NAF.connection.broadcastData('update-like', { id: currentArtData.id, likes: currentArtData.likes });
      }
    }

    function submitComment() {
      const input = document.getElementById('comment-input');
      const text = input.value.trim();
      if (!text || !currentArtData) return;

      if (!currentArtData.comments) currentArtData.comments = [];
      currentArtData.comments.push(text);
      
      updateCommentsUI();
      input.value = '';

      if (NAF.connection.isConnected()) {
        NAF.connection.broadcastData('update-comment', { id: currentArtData.id, comment: text });
      }
    }

    function updateCommentsUI() {
      const list = document.getElementById('modal-comments-list');
      list.innerHTML = '';
      if (!currentArtData.comments || currentArtData.comments.length === 0) {
        list.innerHTML = '<div class="comment-item">尚無留言，點擊下方發言吧！</div>';
        return;
      }
      currentArtData.comments.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.textContent = c;
        list.appendChild(item);
      });
      list.scrollTop = list.scrollHeight;
    }

    document.body.addEventListener('connected', function () {
      NAF.connection.subscribeToData('new-image', (senderId, dataType, data) => {
        galleryStore[data.id] = data;
        renderHighQualityArt(data);
      });

      NAF.connection.subscribeToData('update-like', (senderId, dataType, data) => {
        if (galleryStore[data.id]) {
          galleryStore[data.id].likes = data.likes;
          if (currentArtData && currentArtData.id === data.id) {
            document.getElementById('modal-like-count').textContent = data.likes;
          }
        }
      });

      NAF.connection.subscribeToData('update-comment', (senderId, dataType, data) => {
        if (galleryStore[data.id]) {
          if (!galleryStore[data.id].comments) galleryStore[data.id].comments = [];
          galleryStore[data.id].comments.push(data.comment);
          if (currentArtData && currentArtData.id === data.id) {
            updateCommentsUI();
          }
        }
      });
    });
  </script>

</body>
</html>
